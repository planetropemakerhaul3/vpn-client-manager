<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="55%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ddad7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3ddad7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ee6e0"/>
      <stop offset="100%" stop-color="#1a7fd6"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ee6e0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cdeffd"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- subtle grid -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- ambient glows -->
  <ellipse cx="920" cy="130" rx="360" ry="260" fill="url(#glowCyan)"/>
  <ellipse cx="1040" cy="260" rx="260" ry="200" fill="url(#glowPurple)"/>

  <!-- network tunnel lines connecting server nodes (profile switching) -->
  <g fill="none" stroke-width="2">
    <path d="M 780 300 C 850 250, 830 190, 900 150" stroke="url(#lineGrad)" opacity="0.7"/>
    <path d="M 780 300 C 900 320, 980 300, 1050 240" stroke="url(#lineGrad)" opacity="0.5" stroke-dasharray="6 6"/>
    <path d="M 900 150 C 960 120, 1010 100, 1080 90" stroke="url(#lineGrad)" opacity="0.6" stroke-dasharray="4 8"/>
    <path d="M 900 150 C 950 170, 1000 200, 1050 240" stroke="url(#lineGrad)" opacity="0.4"/>
  </g>

  <!-- inactive server nodes -->
  <g fill="#12233f" stroke="#3ddad7" stroke-width="1.5" opacity="0.85">
    <circle cx="1080" cy="90" r="8"/>
    <circle cx="1050" cy="240" r="8"/>
    <circle cx="960" cy="290" r="7"/>
  </g>

  <!-- active profile node (glowing) -->
  <circle cx="900" cy="150" r="16" fill="url(#glowCyan)"/>
  <circle cx="900" cy="150" r="8" fill="#2ee6e0"/>

  <!-- shield / lock, central device icon -->
  <g transform="translate(780,300)">
    <path d="M0 -90 L46 -70 L46 -18 C46 22 24 48 0 60 C-24 48 -46 22 -46 -18 L-46 -70 Z"
          fill="url(#shieldGrad)" opacity="0.95"/>
    <path d="M0 -90 L46 -70 L46 -18 C46 22 24 48 0 60 C-24 48 -46 22 -46 -18 L-46 -70 Z"
          fill="none" stroke="#0a1128" stroke-width="2" opacity="0.4"/>
    <rect x="-14" y="-14" width="28" height="22" rx="4" fill="#0a1128"/>
    <path d="M-9 -14 L-9 -22 C-9 -30 9 -30 9 -22 L9 -14" fill="none" stroke="#0a1128" stroke-width="4"/>
    <circle cx="0" cy="-3" r="3" fill="#3ddad7"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="700"
        fill="url(#textGlow)" textLength="760" lengthAdjust="spacingAndGlyphs">VPN Client Manager</text>

  <!-- tagline -->
  <text x="60" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400"
        fill="#a8c6e5" textLength="900" lengthAdjust="spacingAndGlyphs">Manage VPN connections with built-in profile switching — single binary</text>

  <!-- small accent badge -->
  <g transform="translate(60,240)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#0f2b4a" stroke="#2ee6e0" stroke-width="1.2" opacity="0.9"/>
    <circle cx="20" cy="17" r="6" fill="#2ee6e0"/>
    <text x="36" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#cdeffd">encrypted &amp; portable</text>
  </g>
</svg>